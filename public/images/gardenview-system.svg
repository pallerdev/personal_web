<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Arquitectura de GardenView</title><desc id="desc">React se comunica mediante Inertia con controladores Laravel. Eloquent persiste usuarios, huertos y plantas en SQLite.</desc><rect width="960" height="360" fill="#eef0ec"/><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#111315" stroke-width="2"><rect x="40" y="92" width="170" height="92" rx="8"/><rect x="278" y="92" width="170" height="92" rx="8"/><rect x="516" y="92" width="170" height="92" rx="8"/><rect x="754" y="92" width="170" height="92" rx="8"/></g><g fill="#111315" font-size="20" font-weight="700"><text x="125" y="132">React</text><text x="363" y="132">Inertia</text><text x="601" y="132">Laravel</text><text x="839" y="132">SQLite</text></g><g fill="#667078" font-size="15"><text x="125" y="158">Interfaz</text><text x="363" y="158">Puente</text><text x="601" y="158">Reglas y acceso</text><text x="839" y="158">Persistencia</text></g><g stroke="#356ae6" stroke-width="3" fill="none"><path d="M210 138h64"/><path d="m266 130 10 8-10 8"/><path d="M448 138h64"/><path d="m504 130 10 8-10 8"/><path d="M686 138h64"/><path d="m742 130 10 8-10 8"/></g><text x="480" y="250" fill="#667078" font-size="15">Modelo de dominio</text><g fill="#183d2d"><rect x="208" y="275" width="160" height="50" rx="25"/><rect x="400" y="275" width="160" height="50" rx="25"/><rect x="592" y="275" width="160" height="50" rx="25"/></g><g fill="#fff" font-size="17"><text x="288" y="306">Usuario</text><text x="480" y="306">Huerto</text><text x="672" y="306">Planta</text></g><path d="M368 300h32M560 300h32" stroke="#183d2d" stroke-width="3"/></g></svg>
